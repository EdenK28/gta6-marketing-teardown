name: Daily data collection

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily
  workflow_dispatch:        # manual trigger button in the Actions tab

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Collect mentions (Reddit + HN)
        run: python src/collect_mentions.py
        continue-on-error: true

      - name: Collect Wikipedia pageviews
        run: python src/collect_wikipedia.py
        continue-on-error: true

      - name: Collect Google Trends
        run: python src/collect_trends.py
        continue-on-error: true

      - name: Commit updated data
        run: |
          git config user.name "data-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: daily collection $(date -u +%F)"
          git push
